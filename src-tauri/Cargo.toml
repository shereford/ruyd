[workspace]
members = ["tunnel"]

[package]
name = "ruyd"
version = "0.3.0"
description = "Encrypted direct chat with friends"
authors = ["Ruyd"]
edition = "2021"
[lib]
name = "ruyd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
ruyd-tunnel = { path = "tunnel" }
