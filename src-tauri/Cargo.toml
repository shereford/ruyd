[package]
name = "ruyd"
version = "0.1.0"
description = "A simple private LAN for playing games with friends"
authors = ["Ruyd"]
edition = "2021"
[lib]
name = "ruyd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
