name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build
      - name: Collect installers and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/
          Get-ChildItem release -File | ForEach-Object {
            "{0} *{1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: release/*
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File | Select-Object -ExpandProperty FullName
          gh release create $env:GITHUB_REF_NAME $assets --verify-tag --latest --title "Ruyd $env:GITHUB_REF_NAME" --notes "Ruyd Windows release. This development release is not Authenticode-signed and Windows may display a SmartScreen warning. SHA-256 checksums and GitHub build-provenance attestations are provided for verification."
